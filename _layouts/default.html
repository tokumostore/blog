<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E7E0F7">
<meta name="color-scheme" content="only light">
{% seo %}
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<header class="site-header">
  <div class="topbar">
    <div class="wrap top-links">
      {% for l in site.links %}<a href="{{ l.url }}" class="tl tl-{{ forloop.index }}">{{ l.name }}</a>{% endfor %}
    </div>
  </div>
  <div class="wrap header-row">
    <a class="logo" href="{{ '/' | relative_url }}"><img src="{{ site.logo | relative_url }}" alt="토크모스토어 블로그" width="218" height="40"></a>
  </div>
  <nav class="wrap cat-nav" aria-label="카테고리">
    <a href="{{ '/' | relative_url }}" class="chip{% if page.url == '/' or page.url contains '/page/' %} on{% endif %}">전체</a>
    {% for cat in site.categories %}{% assign key = cat[0] %}
    <a href="{{ '/' | append: key | append: '/' | relative_url }}" class="chip{% if page.category_key == key or page.categories contains key %} on{% endif %}">{{ site.data.categories[key] | default: key }}</a>
    {% endfor %}
  </nav>
</header>
<main class="wrap">
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap">
    <svg class="wave" viewBox="0 0 340 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 13 Q 21 0 42 13 T 85 13 T 127 13 T 170 13 T 212 13 T 255 13 T 297 13 T 340 13 V24 H0 Z"/></svg>
    <div class="foot-body">
      <div class="stickers" aria-hidden="true"><span class="st-tok">톡</span><span class="st-kku">꾸</span><span class="st-mo">모</span></div>
      <p class="foot-line">단체 주문도 편하게 · 견적·후불·세금계산서 가능</p>
      <a class="foot-link" href="{{ site.group_order_url }}">단체 주문 안내 보기</a>
    </div>
  </div>
</footer>
</body>
</html>
