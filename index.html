<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토크모스토어 블로그</title>
<meta name="description" content="토크모스토어 상품 소개와 소식">
<style>
  :root { --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#2f5d8a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); background:#fafaf8; line-height:1.6; }
  header { padding:56px 24px 40px; text-align:center; border-bottom:1px solid var(--line); background:#fff; }
  header h1 { margin:0 0 8px; font-size:2rem; letter-spacing:-0.02em; }
  header p { margin:0; color:var(--muted); }
  main { max-width:880px; margin:0 auto; padding:40px 24px 64px; }
  .notice { background:#fff; border:1px solid var(--line); border-radius:12px; padding:28px; text-align:center; }
  .notice h2 { margin:0 0 8px; font-size:1.25rem; }
  .notice p { margin:0 0 20px; color:var(--muted); }
  .btn { display:inline-block; padding:12px 24px; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  footer { text-align:center; padding:24px; color:var(--muted); font-size:.85rem; border-top:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>토크모스토어 블로그</h1>
  <p>상품 소개와 새 소식을 전합니다</p>
</header>
<main>
  <section class="notice">
    <h2>블로그를 준비하고 있습니다</h2>
    <p>곧 상품 이야기와 새 소식으로 찾아뵙겠습니다.</p>
    <a class="btn" href="https://www.tokumostore.com/">토크모스토어 쇼핑몰 가기</a>
  </section>
</main>
<footer>© 토크모스토어</footer>
</body>
</html>
