<a class="product" href="{{ include.url }}">
  <img src="{{ include.img }}" alt="{{ include.name }}" loading="lazy">
  <span class="p-info"><span class="p-name">{{ include.name }}</span>{% if include.price %}<span class="p-price">{{ include.price }}</span>{% endif %}</span>
  <span class="p-btn">구경하기</span>
</a>
